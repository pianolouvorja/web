# Deploy automático → staging.pianolouvorja.com.br (branch develop)
name: Deploy Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build
        run: npm ci && npm run build

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SOURCE: "dist/"
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.SSH_DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET_STAGING }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/.git/, /node_modules/"
          SCRIPT_BEFORE: |
            whoami
            pwd
            ls -lsha
          SCRIPT_AFTER: |
            echo "$RSYNC_STDOUT"
            echo "Staging deploy finalized → staging.pianolouvorja.com.br"
