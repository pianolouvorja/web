# CI + Deploy — LouvorJA Web
# PR/push: lint, type-check, build, quality gate
# Push develop → staging | Push main → produção
name: CI & Deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: always()
    steps:
      - name: Verifica se todos os gates passaram
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build: ${{ needs.build.result }}"
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.typecheck.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Quality Gate FALHOU — corrija os erros antes do merge"
            exit 1
          fi
          echo "Quality Gate PASSOU"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SOURCE: "dist/"
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.SSH_DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET_STAGING }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/.git/, /node_modules/"
          SCRIPT_BEFORE: |
            whoami
            pwd
            ls -lsha
          SCRIPT_AFTER: |
            echo "$RSYNC_STDOUT"
            echo "Staging deploy finalized → staging.pianolouvorja.com.br"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SOURCE: "dist/"
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.SSH_DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET_PRODUCTION }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/.git/, /node_modules/"
          SCRIPT_BEFORE: |
            whoami
            pwd
            ls -lsha
          SCRIPT_AFTER: |
            echo "$RSYNC_STDOUT"
            echo "Production deploy finalized → app.pianolouvorja.com.br"
