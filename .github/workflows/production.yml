# Deploy automático → app.pianolouvorja.com.br (branch main)
name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build
        run: npm ci && npm run build

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SOURCE: "dist/"
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.SSH_DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          TARGET: ${{ secrets.SSH_DEPLOY_TARGET_PRODUCTION }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/.git/, /node_modules/"
          SCRIPT_BEFORE: |
            whoami
            pwd
            ls -lsha
          SCRIPT_AFTER: |
            echo "$RSYNC_STDOUT"
            echo "Production deploy finalized → app.pianolouvorja.com.br"
